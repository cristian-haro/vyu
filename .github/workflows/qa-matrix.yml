name: Cross-Platform QA Matrix

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  qa-maestro-matrix:
    name: QA Test Matrix (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Cross-Platform QA Maestro Runner
        run: npm run test:qa
