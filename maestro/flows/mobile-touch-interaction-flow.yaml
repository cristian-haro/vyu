appId: "com.vyu.workspace.web"
tags:
  - mobile
  - touch
  - gestures
---
# Flow 2: Mobile / Tablet Touch & Responsive Flow
- openLink: "http://localhost:3000"

# Verify mobile viewport elements
- assertVisible: "Vyú"

# Navigate sidebar tabs on mobile
- tapOn:
    point: "25%,95%" # Tap on Settings Tab
- assertVisible: "Parámetros de Ajuste"
- assertVisible: "Sensibilidad (Threshold)"

- tapOn:
    point: "50%,95%" # Tap on Errors Tab
- assertVisible: "Discrepancias"

- tapOn:
    point: "75%,95%" # Tap on History Tab
- assertVisible: "Historial de Diffs"

# Switch to Split Slider and drag handle
- tapOn: "Split Slider"
- swipe:
    start: "50%,50%"
    end: "20%,50%"
    duration: 800
