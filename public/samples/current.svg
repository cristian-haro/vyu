<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#161f30" />
    </linearGradient>
    <!-- Regression: Color changed to Pink/Rose gradient -->
    <linearGradient id="regressedBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="800" height="64" fill="#0f172a" fill-opacity="0.9" />
  <line x1="0" y1="64" x2="800" y2="64" stroke="#334155" stroke-width="1"/>

  <!-- Logo & Title -->
  <circle cx="44" cy="32" r="14" fill="#6366f1" />
  <polygon points="40,24 50,32 40,40" fill="#ffffff"/>
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Vyú <tspan fill="#818cf8" font-weight="400">Workspace</tspan></text>

  <!-- Nav Status Badge (Regression: Amber Staging) -->
  <rect x="230" y="21" width="110" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="244" cy="33" r="4" fill="#f59e0b" />
  <text x="256" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">STAGING v1.3</text>

  <!-- Nav Action Profile -->
  <circle cx="756" cy="32" r="16" fill="#334155" />
  <text x="750" y="37" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">CH</text>

  <!-- Main Card Container -->
  <g filter="url(#shadow)">
    <rect x="36" y="90" width="728" height="395" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Header Inside Card -->
  <text x="64" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Panel de Control de Regresión Visual</text>
  <text x="64" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Monitoreo de componentes UI y métricas en tiempo real</text>

  <!-- Action Button (Regression: Color changed to Pink & shifted Y from 115 to 125) -->
  <g id="action-button">
    <rect x="580" y="125" width="156" height="42" rx="10" fill="url(#regressedBtnGrad)"/>
    <text x="612" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Generar Reporte</text>
  </g>

  <!-- KPI Box 1 -->
  <rect x="64" y="180" width="200" height="96" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="80" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Componentes Evaluados</text>
  <text x="80" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">148</text>
  <rect x="180" y="226" width="68" height="22" rx="6" fill="#10b981" fill-opacity="0.15"/>
  <text x="190" y="241" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">✓ 100%</text>

  <!-- KPI Box 2 -->
  <rect x="284" y="180" width="200" height="96" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="300" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Tiempo de Render</text>
  <text x="300" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">14<tspan font-size="16" font-weight="500">ms</tspan></text>

  <!-- KPI Box 3 (Regression: 1.42% in Orange) -->
  <rect x="504" y="180" width="232" height="96" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="520" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Tasa de Discrepancia</text>
  <text x="520" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f97316">1.42%</text>

  <!-- Mini Chart / Visual Section -->
  <rect x="64" y="300" width="672" height="155" rx="12" fill="#0f172a" fill-opacity="0.4" stroke="#1e293b" stroke-width="1"/>
  <text x="84" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Historial de Estabilidad de Diseño</text>

  <!-- Bars in Chart (Regression: bars 4 & 5 heights changed) -->
  <rect x="84" y="390" width="36" height="45" rx="6" fill="url(#barGrad)"/>
  <rect x="144" y="370" width="36" height="65" rx="6" fill="url(#barGrad)"/>
  <rect x="204" y="355" width="36" height="80" rx="6" fill="url(#barGrad)"/>
  <rect x="264" y="310" width="36" height="125" rx="6" fill="url(#barGrad)"/>
  <rect x="324" y="385" width="36" height="50" rx="6" fill="url(#barGrad)"/>
  <rect x="384" y="345" width="36" height="90" rx="6" fill="url(#barGrad)"/>
  <rect x="444" y="350" width="36" height="85" rx="6" fill="url(#barGrad)"/>
  <rect x="504" y="365" width="36" height="70" rx="6" fill="url(#barGrad)"/>
  <rect x="564" y="340" width="36" height="95" rx="6" fill="url(#barGrad)"/>
  <rect x="624" y="355" width="36" height="80" rx="6" fill="url(#barGrad)"/>
  <rect x="684" y="335" width="36" height="100" rx="6" fill="url(#barGrad)"/>
</svg>
